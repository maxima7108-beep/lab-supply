<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سلاسل الإمداد">
<title>منصة إدارة سلاسل الإمداد بالمختبر | Lab Supply Chain</title>
<style id="pageStyle">@page{size:A4;margin:10mm}</style>
<style>
:root{
  --navy:#0f2a43;--navy2:#16385a;--pri:#0b7285;--pri2:#0c8599;--pri-l:#e3f4f7;
  --bg:#f2f5f9;--card:#fff;--line:#e3e8ef;--txt:#1e293b;--mut:#64748b;
  --r:#dc2626;--r-l:#fde8e8;--o:#ea580c;--o-l:#ffedd5;--a:#b45309;--a-l:#fef3c7;--g:#15803d;--g-l:#dcfce7;--b:#1d4ed8;--b-l:#dbeafe;
  --rad:12px;--sh:0 1px 2px rgba(15,42,67,.06),0 4px 14px rgba(15,42,67,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--pri)}
.ltr{direction:ltr;unicode-bidi:embed}
.mono{font-family:Consolas,"Courier New",monospace;direction:ltr;unicode-bidi:embed}
.mut{color:var(--mut)} .sm{font-size:12px}
/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 55%,var(--pri) 100%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art:after{content:"";position:absolute;inset:auto -120px -160px auto;width:460px;height:460px;border-radius:50%;border:60px solid rgba(255,255,255,.05)}
.auth-art h1{font-size:34px;line-height:1.35;margin:18px 0 10px}
.auth-art p{opacity:.8;line-height:1.8;max-width:460px}
.auth-feats{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;position:relative;z-index:1}
.auth-feats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;font-size:13px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px}
.auth-box{width:100%;max-width:400px}
.auth-box h2{margin:0 0 6px;font-size:24px}
.auth-box .mut{margin-bottom:24px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700}
.logo svg{flex:none}
/* ---------- forms ---------- */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
.fld label .req{color:var(--r)}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1px solid #cfd8e3;border-radius:9px;background:#fff;outline:none;transition:.15s}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,114,133,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.chk input{width:17px;height:17px;accent-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid transparent;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#fff;color:var(--txt);border-color:#cfd8e3}.btn.sec:hover{background:#f6f8fb}
.btn.dan{background:var(--r)}.btn.dan:hover{background:#b91c1c}
.btn.ok{background:var(--g)}.btn.ok:hover{background:#166534}
.btn.ghost{background:transparent;color:var(--pri);padding:6px 10px}.btn.ghost:hover{background:var(--pri-l)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--r-l);color:var(--r);padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:13px}
/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:252px;flex:none;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .logo{padding:20px 18px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.side .logo small{display:block;font-weight:400;font-size:11px;color:#94a3b8;margin-top:2px}
.nav{padding:12px 10px;flex:1;overflow:auto}
.nav .sec{font-size:11px;color:#64748b;padding:14px 12px 6px;letter-spacing:.5px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:transparent;color:#cbd5e1;border-radius:9px;cursor:pointer;text-align:right;font-size:14px;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--pri);color:#fff}
.nav button svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .cnt{margin-inline-start:auto;background:var(--r);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;font-weight:700}
.ubox{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ubox .nm{color:#fff;font-weight:600;font-size:13px}
.ubox .rl{font-size:11px;color:#94a3b8}
.ubox button{margin-inline-start:auto;background:transparent;border:0;color:#94a3b8;cursor:pointer;padding:6px;border-radius:7px}
.ubox button:hover{background:rgba(255,255,255,.08);color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;white-space:nowrap}
.gscan{flex:1;max-width:520px;margin-inline-start:auto;position:relative}
.gscan input{width:100%;padding:10px 40px 10px 14px;border:1px solid #cfd8e3;border-radius:10px;background:#f8fafc;outline:none}
.gscan input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(11,114,133,.12)}
.gscan svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.clock{font-size:12px;color:var(--mut);white-space:nowrap}
.view{padding:24px 26px 60px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{margin:0;font-size:15px}
.card .bd0{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.kpi .v{font-size:26px;font-weight:800}
.kpi .l{font-size:12.5px;color:var(--mut)}
.ic.b{background:var(--b-l);color:var(--b)}.ic.g{background:var(--g-l);color:var(--g)}.ic.r{background:var(--r-l);color:var(--r)}.ic.o{background:var(--o-l);color:var(--o)}.ic.a{background:var(--a-l);color:var(--a)}.ic.t{background:var(--pri-l);color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.qa button{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--rad);cursor:pointer;text-align:right;box-shadow:var(--sh);transition:.15s}
.qa button:hover{border-color:var(--pri);transform:translateY(-2px)}
.qa b{display:block;font-size:14.5px}.qa small{color:var(--mut)}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.dcard{padding:16px;cursor:pointer;border-top:4px solid var(--dc);transition:.15s}
.dcard:hover{transform:translateY(-2px)}
.dcard h4{margin:0 0 2px;font-size:14px;letter-spacing:.3px}
.dcard .ar{font-size:12px;color:var(--mut)}
.dcard .st{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mut)}
.dcard .st b{display:block;font-size:18px;color:var(--txt)}
.dcard .fl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;min-height:22px}
/* ---------- table ---------- */
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse}
.t th{background:#f8fafc;color:#475569;font-weight:600;font-size:12.5px;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid #eef2f6;vertical-align:middle}
.t tr:hover td{background:#fafcfe}
.t tr.click{cursor:pointer}
.t .nm{font-weight:600}
.t .acts{white-space:nowrap;text-align:left}
.empty{padding:40px;text-align:center;color:var(--mut)}
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bd.g{background:var(--g-l);color:var(--g)}.bd.r{background:var(--r-l);color:var(--r)}.bd.o{background:var(--o-l);color:var(--o)}.bd.a{background:var(--a-l);color:var(--a)}.bd.b{background:var(--b-l);color:var(--b)}.bd.n{background:#eef2f6;color:#475569}
.dtag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;background:var(--dc);letter-spacing:.3px;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .in{width:auto;min-width:160px;padding:8px 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{border:0;background:transparent;padding:12px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.tabs .bd{margin-inline-start:6px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.banner.w{background:var(--a-l);color:#78350f;border:1px solid #fcd34d}
.banner.i{background:var(--b-l);color:#1e3a8a;border:1px solid #93c5fd}
.banner.e{background:var(--r-l);color:#7f1d1d;border:1px solid #fca5a5}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid #eef2f6;cursor:pointer}
.alist li:hover{background:#fafcfe}
.alist .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.alist .tt{font-weight:600}
.alist .ds{font-size:12.5px;color:var(--mut)}
/* ---------- scan ---------- */
.scanbox{position:relative}
.scanbox input{width:100%;font-size:20px;padding:18px 58px 18px 18px;border:2px dashed #94a3b8;border-radius:14px;outline:none;background:#f8fafc;direction:ltr;text-align:center;font-family:Consolas,monospace}
.scanbox input:focus{border-color:var(--pri);border-style:solid;background:#fff;box-shadow:0 0 0 4px rgba(11,114,133,.12)}
.scanbox input::placeholder{direction:rtl;font-family:'Segoe UI',Tahoma,sans-serif;font-size:16px}
.scanbox svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--pri)}
.icard{border:2px solid var(--pri);border-radius:12px;padding:16px;margin-top:16px;background:var(--pri-l)}
.icard.warn{border-color:var(--o);background:var(--o-l)}
.icard.bad{border-color:var(--r);background:var(--r-l)}
.icard h4{margin:0 0 8px;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kv div{background:#fff;border-radius:8px;padding:8px 10px}
.kv small{display:block;color:var(--mut);font-size:11px}
.kv b{font-size:13.5px}
/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease-out}
.modal.wide{max-width:980px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:17px}
.mhead .x{margin-inline-start:auto;border:0;background:#f1f5f9;width:32px;height:32px;border-radius:8px;cursor:pointer}
.mbody{padding:18px 20px;max-height:72vh;overflow:auto}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-start;background:#fafbfc;border-radius:0 0 14px 14px}
.toasts{position:fixed;bottom:22px;left:22px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);min-width:260px;max-width:420px;font-size:13.5px;border-inline-start:5px solid var(--pri2);animation:pop .2s}
.toast .qt{color:#7dd3fc!important}
.toast.err{border-color:#f87171}.toast.ok{border-color:#4ade80}.toast.wr{border-color:#fbbf24}
.lblprev{display:inline-block;border:1px dashed #94a3b8;background:#fff;padding:0;border-radius:4px}
.dchk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
/* ---------- labels ---------- */
#printArea{display:none}
.lbl{overflow:hidden;background:#fff;color:#000;padding:1.2mm 1.5mm;display:flex;flex-direction:column;justify-content:space-between;font-family:Arial,sans-serif;direction:ltr;text-align:left}
.lbl .l1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.lbl .l2{display:flex;justify-content:space-between;gap:2mm;white-space:nowrap;line-height:1.1}
.lbl .l3{text-align:center;white-space:nowrap;overflow:hidden;line-height:1.1;letter-spacing:.2px}
.lbl svg{display:block;width:100%}
.prhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0f2a43;padding-bottom:8px;margin-bottom:12px}
.prhead h2{margin:0;font-size:18px}
#printArea table{width:100%;border-collapse:collapse;font-size:11px}
#printArea th,#printArea td{border:1px solid #cbd5e1;padding:5px 6px;text-align:right}
#printArea th{background:#e2e8f0}
@media print{
  body.pr > *:not(#printArea){display:none!important}
  body.pr #printArea{display:block}
  body.pr{background:#fff}
  .lbl{page-break-after:always;break-after:page}
  .lbl:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.qa{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{display:none}.side{width:72px}.side .logo span,.nav .sec,.nav button span,.ubox .nm,.ubox .rl{display:none}.nav button{justify-content:center}.kv{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.top{flex-wrap:wrap}.view{padding:16px}}
/* camera */
.cambtn{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:var(--pri);color:#fff;border-radius:8px;width:34px;height:30px;display:grid;place-items:center;cursor:pointer}
.scanbox .cambtn{left:10px;width:46px;height:42px;border-radius:10px}
.scanbox .cambtn svg,.gscan .cambtn svg{position:static;transform:none;color:#fff}
.gscan input{padding-left:48px}.scanbox input{padding-left:64px}
.camwide{display:none;margin-top:10px}
.cam{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .fr{position:absolute;left:8%;right:8%;top:32%;height:26%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.cam .fr:after{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 8px #ef4444;animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{top:15%}50%{top:85%}}
.cam .tb{position:absolute;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px;color:#fff;background:linear-gradient(#000a,#0000)}
.cam .bb{position:absolute;left:0;right:0;bottom:0;padding:16px 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;background:linear-gradient(#0000,#000c)}
.cam .msg{font-size:15px;text-align:center;min-height:22px}
.cam .cbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:12px;padding:11px 20px;font-size:15px;cursor:pointer}
.cam .cbtn.on{background:#facc15;color:#000}
.cam .mode{font-size:11px;opacity:.6}
/* phone layout */
@media (max-width:700px){
 body{font-size:14px}
 .shell{flex-direction:column}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.15)}
 .side .logo,.nav .sec{display:none}
 .nav{display:flex;padding:5px 4px;overflow-x:auto;gap:2px;flex:1}
 .nav button{flex-direction:column;gap:3px;padding:6px 4px;font-size:10.5px;min-width:64px;margin:0;justify-content:center;position:relative}
 .nav button span{display:block;white-space:nowrap}
 .nav .cnt{position:absolute;top:2px;left:8px;font-size:9.5px;padding:0 5px}
 .ubox{display:none}
 .top{padding:10px 12px calc(10px);padding-top:max(10px,env(safe-area-inset-top));gap:8px;flex-wrap:wrap}
 .top h1{font-size:17px}.clock{display:none}
 .mtools{display:flex!important;gap:4px;margin-inline-start:auto}
 .gscan{order:3;flex-basis:100%;max-width:none;margin:0}
 .view{padding:12px 12px 96px}
 .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi .v{font-size:22px}
 .qa{grid-template-columns:1fr 1fr;gap:10px}.qa button{padding:12px;gap:8px}.qa small{display:none}
 .depts{grid-template-columns:1fr 1fr;gap:10px}.dcard{padding:12px}
 .cols{grid-template-columns:1fr}
 .grid2,.grid3{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr 1fr}
 .mback{padding:0;align-items:stretch}
 .modal,.modal.wide{max-width:none;border-radius:0;min-height:100%}
 .mbody{max-height:none}
 .mfoot{position:sticky;bottom:0;flex-wrap:wrap;border-radius:0}
 .filters .in{min-width:0!important;flex:1 1 140px}
 .card .hd{padding:12px}
 .t th,.t td{padding:8px 9px}
 .camwide{display:flex}
 .scanbox input{font-size:17px;padding:15px 64px 15px 14px}
 .toasts{left:10px;right:10px;bottom:84px}.toast{min-width:0;max-width:none}
 .banner{flex-wrap:wrap}
 .auth-form{padding:22px}
 html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}
 main,.view,.card,.cols>*,.grid2>*,.grid3>*,.kv>*,.icard{min-width:0;max-width:100%}
 .tabs{overflow-x:auto;scrollbar-width:none;padding:0 4px}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;padding:11px 10px}
 .tabs .sp,.tabs>.btn{display:none}
 .kpis{grid-template-columns:1fr 1fr!important}
 .in,select.in,textarea.in,.gscan input,.filters .in,input,select,textarea{font-size:16px!important}
 .scanbox input{font-size:17px!important}
 .card .hd .btn{flex:1 1 auto}
 .row{gap:8px}
 .icard .row .btn{flex:1 1 100%}
 .mfoot .btn{flex:1 1 40%}
 .lbl.lblprev{transform-origin:center;max-width:100%}
 /* tables become cards on phones */
 .tw{overflow-x:visible}

<div id="app"></div>
<div id="modalRoot"></div>

<div id="printArea"></div>

<script>
'use strict';
/* =====================================================================
   منصة إدارة سلاسل الإمداد بالمختبر — Lab Supply Chain Management
   ملف واحد يعمل بدون إنترنت. البيانات محفوظة في متصفح هذا الجهاز.
   ===================================================================== */
const KEY='LSCM_DB_v1', SKEY='LSCM_SESSION';
const ROLES={admin:'مدير النظام',manager:'مشرف قسم',tech:'فني مختبر'};
const CATS={reagent:'محلول / كاشف',kit:'عدة فحص (Kit)',control:'كنترول',calibrator:'معايرة',consumable:'مستهلكات'};
const UNITS=['Kit','Box','Pack','Bottle','Vial','Cartridge','Rack','Tube','Piece','Plate','Strip','Roll'];
const STORAGE=['2-8°C','-20°C','-80°C','15-25°C','≤30°C'];
const TXT={IN:'استلام',OUT:'صرف',ADJ:'تعديل جرد',WASTE:'إتلاف / هدر'};
const DEFAULT_DEPTS=[
 ['CHEM','CHEMISTRY','الكيمياء','#2563eb'],['HEMA','HEMATOLOGY','أمراض الدم','#dc2626'],['BB','BLOOD BANK','بنك الدم','#9f1239'],
 ['MICRO','MICROBIOLOGY','الأحياء الدقيقة','#15803d'],['HORM','HORMONE','الهرمونات','#7c3aed'],['SPCH','SPECIAL CHEMISTRY','الكيمياء الخاصة','#0891b2'],
 ['SERO','SEROLOGY','المصليات','#ea580c'],['POCT','POCT','فحوصات نقطة الرعاية','#a16207'],['SR','SAMPLE RECEPTION','استقبال العينات','#475569'],['SO','SENDOUT','الإرسالية','#0f766e']];

/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='')=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=(n,l=2)=>String(n).padStart(l,'0');
function todayStr(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dLeft(exp){if(!exp)return 99999;return Math.round((new Date(exp+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);}
function fmtDT(iso){if(!iso)return'—';const d=new Date(iso);return todayStr(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtD(iso){return iso?todayStr(new Date(iso)):'—';}
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const fmtN=n=>(Math.round(n*100)/100).toLocaleString('en-US');

/* SHA-256 (works offline & on file://) */
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a));}
 var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],bl=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pl=k.length,ic={};
 for(var c=2;pl<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pl]=(mp(c,.5)*mw)|0;k[pl++]=(mp(c,1/3)*mw)|0;}}
 ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
 for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}}return res;}
const hashPw=(pw,salt)=>sha256(salt+'|'+unescape(encodeURIComponent(pw)));

/* ---------------- Code 128 barcode ---------------- */
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function c128codes(s){s=String(s).replace(/[^\x20-\x7e]/g,'');const out=[];let i=0,set=null;
 const run=k=>{let j=k;while(j<s.length&&s.charCodeAt(j)>=48&&s.charCodeAt(j)<=57)j++;return j-k;};
 while(i<s.length){const r=run(i);
  if(r>=4||(set==='C'&&r>=2)){if(set!=='C'){out.push(set===null?105:99);set='C';}const n=r-(r%2);for(let k=0;k<n;k+=2){out.push(+s.substr(i,2));i+=2;}}
  else{if(set!=='B'){out.push(set===null?104:100);set='B';}out.push(s.charCodeAt(i)-32);i++;}}
 let sum=out[0];for(let j=1;j<out.length;j++)sum+=out[j]*j;out.push(sum%103);out.push(106);return out;}
function barcodeSVG(text,hmm){const codes=c128codes(text);let x=10,bars='';
 codes.forEach(c=>{const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="50"/>`;x+=w;}});
 const W=x+10;return `<svg viewBox="0 0 ${W} 50" preserveAspectRatio="none" style="height:${hmm}mm" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="50" fill="#fff"/><g fill="#000">${bars}</g></svg>`;}

/* ---------------- database ---------------- */
function blankDB(){return{meta:{v:1,created:new Date().toISOString(),lastBackup:null,nextLot:1},
 settings:{lab:'مختبر مستشفى النساء والولادة والأطفال — مدينة الملك سلمان بن عبدالعزيز الطبية',expCritical:30,expWarn:90,idleMin:15,labelW:50,labelH:25,forecastDays:30},
 depts:DEFAULT_DEPTS.map(([code,name,ar,color])=>({code,name,ar,color})),users:[],items:[],lots:[],tx:[],audit:[]};}
function migrate(d){const b=blankDB();d.meta=Object.assign(b.meta,d.meta||{});d.settings=Object.assign(b.settings,d.settings||{});
 ['depts','users','items','lots','tx','audit'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=b[k];});
 const ipu=id=>{const it=d.items.find(i=>i.id===id);return Math.max(1,num(it&&it.perUnit)||1);};d.lots.forEach(l=>{if(!(num(l.pu)>0))l.pu=ipu(l.itemId);});d.tx.forEach(t=>{if(!(num(t.pu)>0))t.pu=ipu(t.itemId);});return d;}
function loadDB(){try{const s=localStorage.getItem(KEY);if(s)return migrate(JSON.parse(s));}catch(e){console.error(e);}return blankDB();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true;}catch(e){toast('تعذّر الحفظ — مساحة التخزين ممتلئة، صدّر نسخة احتياطية','err');return false;}}
let DB=loadDB();
const S={user:null,view:'dashboard',f:{dept:'',q:'',st:''},cf:{dept:'',q:''},atab:'all',issued:[],auto:true,last:Date.now(),
 rep:{from:todayStr(new Date(Date.now()-29*864e5)),to:todayStr(),dept:'',type:''},fails:0,lockUntil:0};

/* ---------------- domain helpers ---------------- */
const deptBy=c=>DB.depts.find(d=>d.code===c)||{code:c,name:c,ar:'',color:'#64748b'};
const itemBy=id=>DB.items.find(i=>i.id===id);
const lotBy=id=>DB.lots.find(l=>l.id===+id);
const userBy=u=>DB.users.find(x=>x.username===u);
const isAdmin=()=>S.user&&S.user.role==='admin';
function myDepts(){if(!S.user)return[];return isAdmin()?DB.depts.map(d=>d.code):(S.user.depts||[]).filter(c=>DB.depts.some(d=>d.code===c));}
const canSee=c=>myDepts().includes(c);
const visItems=()=>DB.items.filter(i=>canSee(i.dept));
function can(a){const r=S.user&&S.user.role;if(r==='admin')return true;if(['items','adjust','reports'].includes(a))return r==='manager';if(['receive','issue','waste'].includes(a))return true;return false;}
function dtag(c){const d=deptBy(c);return `<span class="dtag" style="--dc:${d.color}">${esc(d.name)}</span>`;}
function lotsOf(itemId,all){return DB.lots.filter(l=>l.itemId===itemId&&(all||l.qty>0)).sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'));}
function expState(exp){if(!exp)return'ok';const d=dLeft(exp),s=DB.settings;if(d<0)return'expired';if(d<=s.expCritical)return'critical';if(d<=s.expWarn)return'warn';return'ok';}
function usageRate(itemId){const days=+DB.settings.forecastDays||30,from=Date.now()-days*864e5;
 return DB.tx.filter(t=>t.itemId===itemId&&t.type==='OUT'&&new Date(t.t).getTime()>=from).reduce((a,t)=>a+t.qty,0)/days;}
function itemInfo(it){const lots=lotsOf(it.id),valid=lots.filter(l=>dLeft(l.exp)>=0),stock=r6(valid.reduce((a,l)=>a+l.qty,0)),tests=Math.round(valid.reduce((a,l)=>a+l.qty*LPU(l),0)*100)/100,rate=usageRate(it.id);
 const cover=rate>0?Math.floor(stock/rate):null;let status='ok';
 if(stock<=0)status='out';else if(stock<=num(it.min)||(cover!==null&&cover<=num(it.lead||14)))status='low';
 return{lots,valid,stock,tests,next:valid[0],rate,cover,status,expiredQty:lots.filter(l=>dLeft(l.exp)<0).reduce((a,l)=>a+l.qty,0)};}
function getAlerts(){const A=[];
 visItems().filter(i=>i.active!==false).forEach(it=>{const inf=itemInfo(it);
  if(inf.status==='out')A.push({sev:4,type:'out',item:it,msg:'نفد من المخزون — يلزم طلب توريد عاجل'});
  else if(inf.status==='low')A.push({sev:2,type:'low',item:it,msg:`مخزون منخفض: ${stockTxt(it,inf,false)} (الحد الأدنى ${fmtN(num(it.min))} ${it.unit})`+(inf.cover!==null?` — يكفي ~${inf.cover} يوم`:'')});
  inf.lots.forEach(l=>{const e=expState(l.exp),d=dLeft(l.exp);
   const waste=inf.rate>0&&inf.rate*d<l.qty?` — متوقع بقاء ${Math.ceil(l.qty-inf.rate*d)} دون استخدام`:'';
   if(e==='expired')A.push({sev:5,type:'expired',item:it,lot:l,msg:`منتهي الصلاحية منذ ${-d} يوم — الكمية ${qtyTxt(it,l.qty,false,LPU(l))} (يجب سحبه وإتلافه)`});
   else if(e==='critical')A.push({sev:3,type:'critical',item:it,lot:l,msg:`تنتهي صلاحيته خلال ${d} يوم — الكمية ${qtyTxt(it,l.qty,false,LPU(l))}${waste}`});
   else if(e==='warn')A.push({sev:1,type:'warn',item:it,lot:l,msg:`تنتهي صلاحيته خلال ${d} يوم — الكمية ${l.qty}${waste}`});});});
 return A.sort((a,b)=>b.sev-a.sev||((a.lot&&a.lot.exp)||'').localeCompare((b.lot&&b.lot.exp)||''));}
function addTx(type,lot,qty,note){const it=itemBy(lot.itemId);DB.tx.push({id:uid('t'),t:new Date().toISOString(),type,itemId:lot.itemId,lotId:lot.id,lot:lot.lot,dept:it?it.dept:'',qty,pu:LPU(lot),user:S.user.username,uname:S.user.name,note:note||''});}
function audit(a,d){DB.audit.push({t:new Date().toISOString(),u:S.user?S.user.username:'-',a,d:d||''});if(DB.audit.length>3000)DB.audit.splice(0,DB.audit.length-3000);}
const SUBUNITS=['Test','Vial','Strip','Card','Cartridge','Plate','Tube','mL','Piece','Bottle','Cup'];
const PU=it=>Math.max(1,num(it&&it.perUnit)||1);
const hasPU=it=>PU(it)>1;
const r6=n=>Math.round(n*1e6)/1e6;
const LPU=l=>{if(!l)return 1;if(num(l.pu)>0)return Math.max(1,num(l.pu));return PU(itemBy(l.itemId));};
const hasAnyPU=it=>!!it&&(hasPU(it)||DB.lots.some(l=>l.itemId===it.id&&num(l.pu)>1));
function subTot(it,q,pu){return Math.round(q*(pu||PU(it))*100)/100;}
function stockTxt(it,inf,html=true){const b=`${fmtN(inf.stock)} ${it.unit}`;if(!hasAnyPU(it))return html?`<bdi dir="ltr">${b}</bdi>`:b;const t=`${fmtN(inf.tests)} ${it.subUnit||'Test'}`;return html?`<bdi dir="ltr">${b} <span class="sm qt" style="color:var(--pri);font-weight:700">(${t})</span></bdi>`:`${b} (${t})`;}
function qtyTxt(it,q,html=true,pu){const P=pu||PU(it);const b=`${fmtN(q)} ${it?it.unit:''}`;if(!(P>1))return html?`<bdi dir="ltr">${b}</bdi>`:b;const t=`${fmtN(subTot(it,q,P))} ${it.subUnit||'Test'}`;return html?`<bdi dir="ltr">${b} <span class="sm qt" style="color:var(--pri);font-weight:700">(${t})</span></bdi>`:`${b} (${t})`;}
const bdi=s=>'<bdi>'+esc(s)+'</bdi>';
const jsq=o=>JSON.stringify(o).replace(/'/g,'\\u0027').replace(/</g,'\\u003c');
const cleanMoh=m=>String(m||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function labelPayload(lot){const it=itemBy(lot.itemId);const e=(lot.exp||'').replace(/-/g,'').slice(2)||'000000';return e+pad(lot.id,6)+cleanMoh(it&&it.moh);}

/* ---------------- scanning ---------------- */
function gsObj(r){const o={gtin:r['01']||''};const d=r['17']||r['15'];
 if(d&&/^\d{6}$/.test(d)){const y='20'+d.slice(0,2),mo=d.slice(2,4);let dd=d.slice(4);if(dd==='00')dd=pad(new Date(+y,+mo,0).getDate());o.exp=`${y}-${mo}-${dd}`;}
 if(r['10'])o.lot=r['10'].trim();return o;}
function parseGS1(c){
 if(/^\(\d{2,4}\)/.test(c)){const r={};c.replace(/\((\d{2,4})\)([^(]*)/g,(_,ai,v)=>{r[ai]=v;});return r['01']?gsObj(r):null;}
 if(!/^01\d{14}/.test(c))return null;
 const r={},GS='\x1d',fixed={'01':14,'11':6,'13':6,'15':6,'17':6};let i=0;
 while(i<c.length){if(c[i]===GS){i++;continue;}const ai=c.substr(i,2);i+=2;
  if(fixed[ai]){r[ai]=c.substr(i,fixed[ai]);i+=fixed[ai];}
  else if(['10','21','30','240'].includes(ai)){let j=c.indexOf(GS,i);
   if(j<0){const mm=c.slice(i).match(/^(.+?)(17\d{6})$/);if(mm){r[ai]=mm[1];i+=mm[1].length;continue;}j=c.length;}
   r[ai]=c.slice(i,j);i=j+1;}else break;}
 return gsObj(r);}
function parseScan(raw){let c=String(raw||'').trim().replace(/^\](C1|d2|Q3|e0)/,'');if(!c)return null;
 const m=c.match(/^(\d{6})(\d{6})([A-Z0-9]*)$/i);
 if(m){const lot=lotBy(+m[2]);if(lot){const e=(lot.exp||'').replace(/-/g,'').slice(2)||'000000';if(e===m[1])return{kind:'label',lot,item:itemBy(lot.itemId)};}}
 const g=parseGS1(c);
 if(g&&g.gtin){const z=g.gtin.replace(/^0+/,'');const item=DB.items.find(i=>i.gtin&&i.gtin.replace(/^0+/,'')===z);return Object.assign({kind:'gs1',item,code:g.gtin},g);}
 const z=c.replace(/^0+/,''),cm=cleanMoh(c);
 const item=DB.items.find(i=>(i.gtin&&(i.gtin===c||i.gtin.replace(/^0+/,'')===z))||(cm&&cleanMoh(i.moh)===cm));
 return item?{kind:'item',item,code:c}:{kind:'unknown',code:c};}

/* ---------------- UI helpers ---------------- */
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),type==='err'?6000:3800);}
function modal(title,body,foot,wide){$('#modalRoot').innerHTML=`<div class="mback" onmousedown="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}"><div class="mhead"><h3>${title}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div></div>`;
 setTimeout(()=>{const f=$('#modalRoot [autofocus]');if(f){f.focus();f.select&&f.select();}},40);}
function closeModal(){$('#modalRoot').innerHTML='';}
let _cb=null;
function confirmBox(msg,fn,danger,okTxt){_cb=fn;modal('تأكيد',`<div style="line-height:1.8">${msg}</div>`,`<button class="btn ${danger?'dan':''}" onclick="const f=_cb;closeModal();f&&f()">${okTxt||'تأكيد'}</button><button class="btn sec" onclick="closeModal()">إلغاء</button>`);}
const ST={ok:['متوفر','g'],low:['منخفض','a'],out:['نافد','r'],expired:['منتهي','r'],critical:['حرج','o'],warn:['قريب الانتهاء','a']};
const badge=(k,t)=>`<span class="bd ${(ST[k]||[0,'n'])[1]}">${t||(ST[k]||[k])[0]}</span>`;
function expBadge(exp){if(!exp)return'<span class="bd n">بدون صلاحية</span>';const d=dLeft(exp),s=expState(exp);return `<span class="bd ${ST[s][1]}">${d<0?'منتهي منذ '+(-d)+' يوم':d+' يوم'}</span>`;}
function download(name,content,mime){const b=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(name,rows){const s='﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');download(name+'_'+todayStr()+'.csv',s,'text/csv;charset=utf-8');}
function setPage(size,margin){$('#pageStyle').textContent=`@page{size:${size};margin:${margin}}`;}
window.addEventListener('afterprint',()=>{document.body.classList.remove('pr');$('#printArea').innerHTML='';setPage('A4','10mm');});
const I={ /* icons */
 home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 in:'<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3h16v-3"/>',
 out:'<path d="M12 15V3m0 0L8 7m4-4l4 4"/><path d="M4 17v3h16v-3"/>',

const C128P=C128.map(p=>p.slice(0,6).split('').map(Number));
function decodeFrame128(v,cv){const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return null;const W=Math.min(1280,vw),H=Math.round(vh*W/vw);cv.width=W;cv.height=H;

function scan128(L){const n=L.length;let mn=255,mx=0;for(let i=0;i<n;i++){if(L[i]<mn)mn=L[i];if(L[i]>mx)mx=L[i];}if(mx-mn<35)return null;

function sym128(runs,i,mod){if(i+6>runs.length)return -1;let s=0;for(let k=0;k<6;k++)s+=runs[i+k];if(mod&&Math.abs(s/11-mod)>mod*.3)return -1;let best=-1,be=99;

function tryRuns(runs,col){for(let i=1;i+12<runs.length;i++){if(col[i]!==1)continue;const st=sym128(runs,i);if(st<103||st>105)continue;
  let s=0;for(let k=0;k<6;k++)s+=runs[i+k];const mod=s/11;if(runs[i-1]<mod*3.5)continue;
  const codes=[st];let j=i+6,ok=false;while(j+6<=runs.length&&codes.length<90){const c=sym128(runs,j,mod);if(c<0)break;if(c===106){ok=true;break;}codes.push(c);j+=6;}
  if(!ok||codes.length<3)continue;const chk=codes.pop();let sm=codes[0];for(let k=1;k<codes.length;k++)sm+=codes[k]*k;if(sm%103!==chk)continue;
  const t=codes2text128(codes);if(t)return t;}return null;}
function codes2text128(cs){let set=cs[0]===103?'A':cs[0]===104?'B':'C',o='';for(let k=1;k<cs.length;k++){const c=cs[k];

  if(set==='C'){if(c<100)o+=pad(c);else if(c===100)set='B';else if(c===101)set='A';else return null;continue;}
  if(c===99){set='C';continue;}if(set==='B'&&c===101){set='A';continue;}if(set==='A'&&c===100){set='B';continue;}if(c>=96)continue;
  o+=set==='B'?String.fromCharCode(c+32):(c<64?String.fromCharCode(c+32):String.fromCharCode(c-64));}return o||null;}

 const nb=v=>navAllowed(v)?`<button class="${S.view===v?'on':''}" onclick="go('${v}')" title="${VIEWS[v][0]}">${ic(VIEWS[v][1])}<span>${VIEWS[v][0]}</span>${v==='alerts'&&hot?`<b class="cnt">${hot}</b>`:''}</button>`:'';

 <div class="sec">البيانات</div>${nb('items')}${nb('reports')}${isAdmin()?`<div class="sec">الإدارة</div>${nb('users')}${nb('settings')}`:''}</nav>
 <div class="ubox"><div class="av">${esc(u.name.trim()[0]||'?')}</div><div><div class="nm">${esc(u.name)}</div><div class="rl">${ROLES[u.role]}</div></div>

 <div class="mtools"><button title="تغيير كلمة المرور" onclick="changeMyPw()">${ic('key',17)}</button><button title="تسجيل الخروج" onclick="logout()">${ic('exit',17)}</button></div>
 <div class="clock">${todayStr()}</div></header><section class="view" id="view"></section></main></div>`;
 ({dashboard:vDash,inventory:vInv,receive:vReceive,issue:vIssue,items:vItems,alerts:vAlerts,reports:vReports,users:vUsers,settings:vSettings})[S.view]();}
function globalScan(code){const r=parseScan(code);if(!r)return;
 if(r.item&&!canSee(r.item.dept))return toast('هذا الصنف تابع لقسم '+esc(deptBy(r.item.dept).name)+' — ليس لديك صلاحية عليه','err');
 if(r.kind==='label')return lotModal(r.lot.id);
 if(r.kind==='item'){return itemModal(r.item.id);}
 if(r.kind==='gs1'&&r.item){S.rxPre={itemId:r.item.id,lot:r.lot,exp:r.exp};return go('receive');}
 unknownCode(r);}
function unknownCode(r){const g=r.kind==='gs1';
 modal('باركود غير مسجّل',`<p>الرمز <b class="mono">${esc(r.code)}</b> غير مرتبط بأي بند في الدليل.</p>${g?`<p class="sm mut">تم التعرف عليه كباركود مورّد GS1${r.lot?` — التشغيلة: <b class="mono">${esc(r.lot)}</b>`:''}${r.exp?` — الصلاحية: <b class="mono">${r.exp}</b>`:''}</p>`:''}
 ${can('items')?'<p>هل تريد إضافة بند جديد وربطه بهذا الباركود؟</p>':'<p class="mut">اطلب من مشرف القسم إضافة البند للدليل.</p>'}`,
 can('items')?`<button class="btn" onclick='itemForm(null,${jsq({gtin:r.code,_lot:r.lot||"",_exp:r.exp||""})})'>إضافة بند جديد</button><button class="btn sec" onclick="closeModal()">إغلاق</button>`:`<button class="btn sec" onclick="closeModal()">إغلاق</button>`);}

 const lb=DB.meta.lastBackup,lbd=lb?Math.floor((Date.now()-new Date(lb))/864e5):null;

 const recent=DB.tx.filter(t=>canSee(t.dept)).slice(-8).reverse();
 const h=new Date().getHours();
 $('#view').innerHTML=`
 ${isAdmin()&&(lbd===null||lbd>=7)?`<div class="banner w">${ic('warn')}<div class="sp">${lbd===null?'لم يتم أخذ نسخة احتياطية بعد.':`آخر نسخة احتياطية قبل ${lbd} يوم.`} البيانات محفوظة في متصفح هذا الجهاز — يُنصح بتصدير نسخة احتياطية أسبوعياً.</div><button class="btn sm" onclick="exportBackup()">تصدير نسخة الآن</button></div>`:''}
 <div class="row" style="margin-bottom:18px"><div><div style="font-size:20px;font-weight:700">${h<12?'صباح الخير':'مساء الخير'}، ${esc(S.user.name.split(' ')[0])} 👋</div><div class="mut sm">${esc(DB.settings.lab)} — ${isAdmin()?'عرض جميع الأقسام':'أقسامك: '+myDepts().map(c=>deptBy(c).name).join('، ')}</div></div></div>
 <div class="kpis">${kp(its.length,'بنود مسجّلة','t','list',"go('items')")}${kp(fmtN(units),'وحدات صالحة بالمخزون','b','box',"go('inventory')")}
 ${kp(cnt('expired'),'دفعات منتهية الصلاحية','r','x',"S.atab='expired';go('alerts')")}${kp(cnt('critical')+cnt('warn'),'قريبة الانتهاء','o','clock',"S.atab='expiring';go('alerts')")}
 ${kp(cnt('low'),'مخزون منخفض','a','warn',"S.atab='low';go('alerts')")}${kp(cnt('out'),'نافدة من المخزون','r','box',"S.atab='out';go('alerts')")}</div>
 <div class="qa"><button onclick="go('receive')"><div class="ic g" style="width:42px;height:42px;border-radius:10px;display:grid;place-items:center">${ic('in',22)}</div><div><b>استلام محاليل</b><small>بالباركود أو يدوياً + طباعة ملصق</small></div></button>
 <button onclick="go('issue')"><div class="ic b" style="width:42px;height:42px;border-radius:10px;display:grid;place-items:center">${ic('out',22)}</div><div><b>صرف محلول</b><small>امسح الملصق للخصم من المخزون</small></div></button>
 ${can('items')?`<button onclick="itemForm()"><div class="ic t" style="width:42px;height:42px;border-radius:10px;display:grid;place-items:center">${ic('tag',22)}</div><div><b>إضافة بند جديد</b><small>تسجيل اختبار برقم البند الوزاري</small></div></button>`:''}
 <button onclick="go('alerts')"><div class="ic r" style="width:42px;height:42px;border-radius:10px;display:grid;place-items:center">${ic('bell',22)}</div><div><b>التنبيهات</b><small>${al.length} تنبيه نشط</small></div></button></div>
 <h3 style="margin:0 0 12px;font-size:16px">الأقسام</h3>
 <div class="depts">${myDepts().map(c=>{const d=deptBy(c),di=its.filter(i=>i.dept===c),da=al.filter(a=>a.item.dept===c);
  const u=di.reduce((a,i)=>a+itemInfo(i).stock,0),ex=da.filter(a=>a.type==='expired'||a.type==='critical').length,lo=da.filter(a=>a.type==='low'||a.type==='out').length;
  return `<div class="card dcard" style="--dc:${d.color}" onclick="S.f={dept:'${c}',q:'',st:''};go('inventory')"><h4>${esc(d.name)}</h4><div class="ar">${esc(d.ar)}</div>
  <div class="st"><div><b>${di.length}</b>بند</div><div><b>${fmtN(u)}</b>وحدة</div></div>
  <div class="fl">${ex?badge('critical',ex+' صلاحية'):''}${lo?badge('low',lo+' مخزون'):''}${!ex&&!lo?badge('ok','لا تنبيهات'):''}</div></div>`;}).join('')||'<div class="mut">لا توجد أقسام مخصّصة لحسابك — راجع مدير النظام.</div>'}</div>
 <div class="cols"><div class="card"><div class="hd"><h3>أهم التنبيهات</h3><span class="sp"></span><button class="btn ghost sm" onclick="go('alerts')">عرض الكل</button></div>${alertList(al.slice(0,8))}</div>
 <div class="card"><div class="hd"><h3>آخر الحركات</h3><span class="sp"></span>${can('reports')?`<button class="btn ghost sm" onclick="go('reports')">السجل الكامل</button>`:''}</div>
 ${recent.length?`<ul class="alist">${recent.map(t=>{const it=itemBy(t.itemId);return `<li onclick="${it?`itemModal('${t.itemId}')`:''}"><span class="dot" style="background:${t.type==='IN'?'var(--g)':t.type==='OUT'?'var(--b)':'var(--o)'}"></span><div><div class="tt">${TXT[t.type]} ${fmtN(t.qty)} — ${bdi(it?it.name:'(محذوف)')}</div><div class="ds">${fmtDT(t.t)} · ${esc(t.uname)} · LOT ${esc(t.lot||'')}</div></div></li>`;}).join('')}</ul>`:'<div class="empty">لا توجد حركات بعد</div>'}</div></div>`;}
function alertList(list){if(!list.length)return'<div class="empty">✅ لا توجد تنبيهات — كل شيء تحت السيطرة</div>';
 const col={expired:'var(--r)',out:'var(--r)',critical:'var(--o)',low:'var(--a)',warn:'#eab308'};
 return `<ul class="alist">${list.map(a=>`<li onclick="itemModal('${a.item.id}')"><span class="dot" style="background:${col[a.type]}"></span><div style="flex:1"><div class="tt">${bdi(a.item.name)} ${a.lot?`<span class="mono sm mut">LOT ${esc(a.lot.lot)}</span>`:''}</div><div class="ds">${a.msg}</div></div>${dtag(a.item.dept)}</li>`).join('')}</ul>`;}

/* ---------------- inventory ---------------- */
function deptSelect(id,val,onch,all){return `<select class="in" id="${id}" onchange="${onch}">${all!==false?`<option value="">كل الأقسام</option>`:''}${myDepts().map(c=>`<option value="${c}" ${c===val?'selected':''}>${esc(deptBy(c).name)}</option>`).join('')}</select>`;}
function vInv(){$('#view').innerHTML=`<div class="card"><div class="hd"><div class="filters">
 ${deptSelect('f_dept',S.f.dept,"S.f.dept=this.value;invTable()")}
 <input class="in" id="f_q" placeholder="بحث بالاسم / رقم البند / التشغيلة" value="${esc(S.f.q)}" oninput="S.f.q=this.value;invTable()" style="min-width:260px">
 <select class="in" onchange="S.f.st=this.value;invTable()">${[['','كل الحالات'],['ok','متوفر'],['low','منخفض'],['out','نافد'],['exp','قريب/منتهي الصلاحية']].map(([v,t])=>`<option value="${v}" ${S.f.st===v?'selected':''}>${t}</option>`).join('')}</select></div>
 <span class="sp"></span><button class="btn sec sm" onclick="exportInventory()">تصدير Excel</button><button class="btn sec sm" onclick="printInventory()">${ic('print',15)} طباعة</button><button class="btn sm" onclick="go('receive')">+ استلام</button></div>
 <div class="tw" id="invT"></div></div>`;invTable();}
function invRows(){const q=S.f.q.trim().toLowerCase();
 return visItems().filter(i=>i.active!==false&&(!S.f.dept||i.dept===S.f.dept)).map(it=>({it,inf:itemInfo(it)})).filter(({it,inf})=>{
  if(q&&!(it.name+' '+(it.nameAr||'')+' '+it.moh+' '+(it.gtin||'')+' '+inf.lots.map(l=>l.lot).join(' ')).toLowerCase().includes(q))return false;
  if(S.f.st==='exp')return inf.lots.some(l=>expState(l.exp)!=='ok');if(S.f.st)return inf.status===S.f.st;return true;})
  .sort((a,b)=>({out:0,low:1,ok:2}[a.inf.status]-{out:0,low:1,ok:2}[b.inf.status])||a.it.name.localeCompare(b.it.name));}
function invTable(){const rows=invRows();
 $('#invT').innerHTML=rows.length?`<table class="t"><thead><tr><th>الصنف</th><th>القسم</th><th>رقم البند الوزاري</th><th>المخزون الصالح</th><th>الاختبارات المتاحة<br><span class="sm mut" style="font-weight:400">(كل التشغيلات)</span></th><th>الحد الأدنى</th><th>الدفعات</th><th>أقرب انتهاء</th><th>يكفي لمدة</th><th>الحالة</th><th></th></tr></thead><tbody>
 ${rows.map(({it,inf})=>`<tr class="click" onclick="itemModal('${it.id}')"><td><div class="nm">${bdi(it.name)}</div><div class="sm mut">${esc(CATS[it.cat]||'')}${it.analyzer?' · '+esc(it.analyzer):''}</div></td><td>${dtag(it.dept)}</td><td class="mono">${esc(it.moh)}</td>
 <td><b>${fmtN(inf.stock)}</b> <span class="sm mut">${esc(it.unit)}</span>${inf.expiredQty?`<div class="sm" style="color:var(--r)">+${fmtN(inf.expiredQty)} منتهي</div>`:''}</td><td>${hasAnyPU(it)?`<b style="color:var(--pri);font-size:15px">${fmtN(inf.tests)}</b> <span class="sm mut">${esc(it.subUnit||'Test')}</span>${inf.valid.length>1?`<div class="sm mut">${inf.valid.length} تشغيلات</div>`:''}`:'<span class="mut sm">—</span>'}</td><td>${fmtN(num(it.min))}</td><td>${inf.lots.length}</td>
 <td>${inf.lots[0]?`<span class="mono sm">${inf.lots[0].exp||'—'}</span> ${expBadge(inf.lots[0].exp)}`:'—'}</td><td>${inf.cover!==null?inf.cover+' يوم':'<span class="mut sm">لا يوجد استهلاك</span>'}</td><td>${badge(inf.status)}</td>
 <td class="acts" onclick="event.stopPropagation()"><button class="btn ghost sm" onclick="S.rxPre={itemId:'${it.id}'};go('receive')">استلام</button><button class="btn ghost sm" onclick="itemModal('${it.id}')">الدفعات</button></td></tr>`).join('')}</tbody></table>`
 :`<div class="empty">لا توجد بنود مطابقة. ${can('items')?`<a href="#" onclick="event.preventDefault();itemForm()">أضف بنداً جديداً</a>`:''}</div>`;}
function itemModal(id){const it=itemBy(id);if(!it)return;if(!canSee(it.dept))return toast('ليس لديك صلاحية على هذا القسم','err');
 const inf=itemInfo(it),all=lotsOf(id,true),tx=DB.tx.filter(t=>t.itemId===id).slice(-12).reverse();
 modal(`${bdi(it.name)} ${dtag(it.dept)}`,`<div class="kv"><div><small>رقم البند الوزاري</small><b class="mono">${esc(it.moh)}</b></div><div><small>باركود المورّد</small><b class="mono">${esc(it.gtin||'—')}</b></div>

 <div><small>الحد الأدنى / مدة التوريد</small><b>${fmtN(num(it.min))} / ${num(it.lead||14)} يوم</b></div><div><small>اختبارات لكل عبوة</small><b>${hasAnyPU(it)?`<bdi dir="ltr">${(inf.valid.length?[...new Set(inf.valid.map(LPU))]:[PU(it)]).join(' / ')} ${esc(it.subUnit||'Test')} / ${esc(it.unit)}</bdi>`:'—'}</b></div><div style="background:var(--pri-l)"><small>إجمالي الاختبارات المتاحة</small><b style="color:var(--pri);font-size:16px">${hasAnyPU(it)?`<bdi dir="ltr">${fmtN(inf.tests)} ${esc(it.subUnit||'Test')}</bdi>`:'—'}</b></div><div><small>التخزين</small><b>${esc(it.storage||'—')}</b></div><div><small>الجهاز</small><b>${esc(it.analyzer||'—')}</b></div><div><small>المورّد</small><b>${esc(it.supplier||'—')}</b></div></div>
 <h4 style="margin:18px 0 8px">الدفعات (التشغيلات) — مرتبة حسب الأقرب انتهاءً FEFO</h4>
 ${all.length?`<div class="tw"><table class="t"><thead><tr><th>#</th><th>رقم التشغيلة LOT</th><th>تاريخ الانتهاء</th><th>المتبقي</th><th>الكمية</th><th>اختبار/عبوة</th><th>الاختبارات المتاحة</th><th>الموقع</th><th>الاستلام</th><th></th></tr></thead><tbody>
 ${all.map(l=>`<tr style="${l.qty<=0?'opacity:.5':''}"><td class="mono">${pad(l.id,6)}</td><td class="mono">${esc(l.lot)}</td><td class="mono">${l.exp||'—'}</td><td>${l.qty>0?expBadge(l.exp):'<span class="bd n">مستهلك</span>'}</td><td><b>${fmtN(l.qty)}</b> <span class="sm mut">${esc(it.unit)} / ${fmtN(l.init||l.qty)}</span></td><td>${LPU(l)>1?LPU(l):'—'}</td><td><b style="color:${dLeft(l.exp)<0?'var(--r)':'var(--pri)'}">${LPU(l)>1?fmtN(subTot(it,l.qty,LPU(l))):'—'}</b>${dLeft(l.exp)<0&&l.qty>0?' <span class="sm" style="color:var(--r)">(منتهي — لا يُحتسب)</span>':''}</td><td>${esc(l.loc||'—')}</td><td class="sm">${fmtD(l.recv)}<br><span class="mut">${esc(l.by||'')}</span></td>
 <td class="acts">${l.qty>0?`<button class="btn sm" onclick="issuePrompt(${l.id})">صرف</button> `:''}<button class="btn sec sm" onclick="labelPrompt(${l.id})" title="طباعة ملصق">${ic('print',14)}</button> ${l.qty>0?`<button class="btn sec sm" onclick="wastePrompt(${l.id})">إتلاف</button> `:''}${can('adjust')?`<button class="btn sec sm" onclick="adjustPrompt(${l.id})">تعديل</button>`:''}</td></tr>`).join('')}
 <tr style="background:var(--pri-l)"><td colspan="4"><b>الإجمالي المتاح (التشغيلات الصالحة: ${inf.valid.length})</b></td><td><b>${fmtN(inf.stock)} ${esc(it.unit)}</b></td><td></td><td><b style="color:var(--pri);font-size:16px">${hasAnyPU(it)?fmtN(inf.tests)+' '+esc(it.subUnit||'Test'):'—'}</b></td><td colspan="3"></td></tr></tbody></table></div>`:'<div class="empty">لا توجد دفعات مستلمة لهذا البند</div>'}

 `<button class="btn" onclick="closeModal();S.rxPre={itemId:'${id}'};go('receive')">+ استلام دفعة</button>${can('items')?`<button class="btn sec" onclick="itemForm('${id}')">تعديل البند</button>`:''}<button class="btn sec" onclick="closeModal()">إغلاق</button>`,true);}
function lotModal(lotId){const l=lotBy(lotId);if(!l)return;S._back=l.itemId;itemModal(l.itemId);}
function refreshAfter(itemId){save();if(S.view==='issue'||S.view==='receive'){const keep=$('#modalRoot').innerHTML;}render();if(itemId&&S._reopen)itemModal(itemId);}

/* ---------------- lot actions ---------------- */
function issuePrompt(lotId){const l=lotBy(lotId),it=itemBy(l.itemId);if(dLeft(l.exp)<0)return expiredBlock(l);
 const fefo=fefoCheck(l);
 modal('صرف من المخزون',`<div class="icard ${fefo?'warn':''}" style="margin-top:0"><h4>${bdi(it.name)}</h4><div class="sm">LOT <b class="mono">${esc(l.lot)}</b> · EXP <b class="mono">${l.exp||'—'}</b> · المتاح <b>${qtyTxt(it,l.qty,true,LPU(l))}</b></div>${fefo?`<div class="sm" style="margin-top:8px">⚠️ توجد دفعة أقرب انتهاءً (LOT ${esc(fefo.lot)} — ${fefo.exp}). يُفضّل صرفها أولاً.</div>`:''}</div>

function parseCSV(t){t=t.replace(/^﻿/,'');const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===sep){r.push(f);f='';}else if(c==='\n'){r.push(f);rows.push(r);r=[];f='';}else if(c!=='\r')f+=c;}
 if(f||r.length){r.push(f);rows.push(r);}return rows.filter(x=>x.some(v=>v.trim()));}
function doImport(){const f=$('#imp_f').files[0];if(!f)return toast('اختر الملف','err');const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);if(rows.length<2)return toast('الملف فارغ','err');
 const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);let add=0,upd=0,skip=[];
 rows.slice(1).forEach((r,n)=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'';const dv=g('dept').toUpperCase();const dp=DB.depts.find(d=>d.code===dv||d.name.toUpperCase()===dv||d.ar===g('dept'));
  if(!dp||!g('name')||!g('moh')){skip.push(n+2);return;}if(!canSee(dp.code)){skip.push(n+2);return;}
  const d={dept:dp.code,name:g('name'),moh:g('moh'),gtin:g('gtin'),cat:CATS[g('category')]?g('category'):'reagent',unit:g('unit')||'Kit',perUnit:Math.max(1,num(g('per_unit'))||1),subUnit:g('sub_unit')||'Test',min:num(g('min')),lead:num(g('lead_days'))||14,storage:g('storage')||'2-8°C',analyzer:g('analyzer'),supplier:g('supplier'),nameAr:g('name_ar'),active:true};
  const ex=DB.items.find(i=>cleanMoh(i.moh)===cleanMoh(d.moh));if(ex){Object.assign(ex,d);upd++;}else{DB.items.push(Object.assign({id:uid('i'),created:new Date().toISOString()},d));add++;}});

 <div class="card" style="margin-bottom:18px"><div class="hd"><h3>الأقسام</h3><span class="sp"></span><button class="btn sm sec" onclick="deptForm()">+ قسم جديد</button></div><div class="tw"><table class="t"><thead><tr><th>الرمز</th><th>الاسم</th><th>بالعربي</th><th>البنود</th><th>المستخدمون</th><th></th></tr></thead><tbody>
 ${DB.depts.map(d=>`<tr><td class="mono">${d.code}</td><td>${dtag(d.code)}</td><td>${esc(d.ar)}</td><td>${DB.items.filter(i=>i.dept===d.code).length}</td><td>${DB.users.filter(u=>(u.depts||[]).includes(d.code)).length}</td><td class="acts"><button class="btn ghost sm" onclick="deptForm('${d.code}')">تعديل</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><div class="hd"><h3>سجل النشاط (التدقيق)</h3><span class="sp"></span><button class="btn ghost sm" onclick="csv('سجل_النشاط',[['الوقت','المستخدم','الإجراء','التفاصيل'],...DB.audit.map(a=>[fmtDT(a.t),a.u,a.a,a.d])])">تصدير</button></div><div class="tw" style="max-height:380px"><table class="t"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${DB.audit.slice(-150).reverse().map(a=>`<tr><td class="sm">${fmtDT(a.t)}</td><td class="mono sm">${esc(a.u)}</td><td>${esc(a.a)}</td><td class="sm">${esc(a.d)}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div><div class="card" style="margin-bottom:18px"><div class="hd"><h3>معاينة الملصق</h3><span class="sp"></span><button class="btn sm sec" onclick="testLabel()">${ic('print',14)} طباعة تجريبية</button></div><div class="bd0" style="text-align:center;background:#f8fafc">${(()=>{const bk=DB.items;const tmp={id:'__s',...sampleIt};DB.items=[...bk,tmp];sampleLot.itemId='__s';const h=labelHTML(tmp,sampleLot,true);DB.items=bk;return h;})()}
 <div class="sm mut" style="margin-top:12px;line-height:1.8;text-align:right">محتوى الباركود (Code 128): <span class="mono">YYMMDD + رقم الدفعة (6) + رقم البند الوزاري</span><br>مثال: <span class="mono">270531000123</span><span class="mono">4130010001</span> — اسم الاختبار مطبوع نصاً أعلى الملصق. اضبط حجم الملصق حسب طابعتك (مثل Zebra 50×25 مم) واختر في نافذة الطباعة الطابعة الصحيحة وهوامش "بلا".</div></div></div>
 <div class="card" style="margin-bottom:18px"><div class="hd"><h3>النسخ الاحتياطي</h3></div><div class="bd0">
 <div class="sm" style="line-height:1.9;margin-bottom:12px">البيانات محفوظة في متصفح هذا الجهاز (الحجم الحالي ~${sz} KB). آخر نسخة احتياطية: <b>${DB.meta.lastBackup?fmtDT(DB.meta.lastBackup):'لا يوجد'}</b>.<br>انقل النسخة لجهاز آخر باستعادتها من نفس الملف.</div>
 <div class="row"><button class="btn" onclick="exportBackup()">تصدير نسخة احتياطية</button><button class="btn sec" onclick="$('#bk_f').click()">استعادة من ملف</button><input type="file" id="bk_f" accept=".json" hidden onchange="importBackup(this.files[0])"></div></div></div>
 <div class="card" style="border-color:#fca5a5"><div class="hd"><h3 style="color:var(--r)">منطقة الخطر</h3></div><div class="bd0"><div class="row">${demo?`<button class="btn sec" onclick="clearDemo()">حذف البيانات التجريبية</button>`:''}<button class="btn dan" onclick="resetAll()">مسح جميع البيانات</button></div></div></div></div></div>`;}
function saveSettings(){const s=DB.settings,n=k=>Math.max(0,num($('#st_'+k).value));s.lab=$('#st_lab').value.trim()||s.lab;s.expCritical=n('c')||30;s.expWarn=Math.max(n('w'),s.expCritical);s.forecastDays=n('f')||30;s.idleMin=Math.max(1,n('i'));s.labelW=Math.max(20,n('lw'));s.labelH=Math.max(10,n('lh'));audit('تعديل الإعدادات','');save();toast('تم حفظ الإعدادات','ok');render();}
function testLabel(){const s={id:'__s',name:'Glucose Reagent (GLU)',moh:'4130010001',dept:'CHEM'};DB.items.push(s);const h=labelHTML(s,{id:123,lot:'G2405A',exp:'2027-05-31',itemId:'__s'});DB.items.pop();
 setPage(`${DB.settings.labelW}mm ${DB.settings.labelH}mm`,'0');$('#printArea').innerHTML=h;document.body.classList.add('pr');setTimeout(()=>window.print(),250);}
function deptForm(code){const d=code?deptBy(code):{code:'',name:'',ar:'',color:'#0b7285'};
 modal(code?'تعديل قسم':'إضافة قسم',`<div class="grid2"><div class="fld"><label>الرمز (إنجليزي، ثابت)</label><input class="in ltr" id="d_code" value="${esc(d.code)}" ${code?'disabled':''} maxlength="8"></div><div class="fld"><label>اللون</label><input class="in" type="color" id="d_col" value="${d.color}" style="height:42px;padding:4px"></div>
 <div class="fld"><label>الاسم (إنجليزي)</label><input class="in ltr" id="d_name" value="${esc(d.name)}"></div><div class="fld"><label>الاسم بالعربي</label><input class="in" id="d_ar" value="${esc(d.ar)}"></div></div>`,
 `<button class="btn" onclick="saveDept(${code?`'${code}'`:'null'})">حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button>`);}
function saveDept(code){const c=code||$('#d_code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''),name=$('#d_name').value.trim().toUpperCase();if(!c||!name)return toast('الرمز والاسم مطلوبان','err');
 if(code){Object.assign(deptBy(code),{name,ar:$('#d_ar').value.trim(),color:$('#d_col').value});}else{if(DB.depts.some(d=>d.code===c))return toast('الرمز مستخدم','err');DB.depts.push({code:c,name,ar:$('#d_ar').value.trim(),color:$('#d_col').value});}
 audit(code?'تعديل قسم':'إضافة قسم',name);save();closeModal();render();}
function exportBackup(){DB.meta.lastBackup=new Date().toISOString();audit('نسخة احتياطية','');save();download(`LabSupplyChain_Backup_${todayStr()}.json`,JSON.stringify(DB),'application/json');toast('تم تصدير النسخة الاحتياطية — احفظها في مكان آمن (فلاش/مجلد مشترك)','ok');}
function importBackup(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result);}catch(e){return toast('الملف غير صالح','err');}
 if(!d||!Array.isArray(d.users)||!Array.isArray(d.items)||!d.users.length)return toast('هذا ليس ملف نسخة احتياطية للمنصة','err');
 const go_=()=>{DB=migrate(d);save();toast('تمت استعادة البيانات — سجّل الدخول','ok');S.user=null;sessionStorage.removeItem(SKEY);render();};
 if(DB.users.length)confirmBox(`سيتم <b>استبدال جميع البيانات الحالية</b> ببيانات النسخة (${d.items.length} بند، ${(d.lots||[]).length} دفعة، ${d.users.length} مستخدم). متابعة؟`,go_,true,'استعادة');else go_();};rd.readAsText(f);}
function resetAll(){modal('مسح جميع البيانات',`<div class="banner e">سيتم حذف كل البنود والمخزون والحركات والمستخدمين نهائياً من هذا الجهاز.</div><div class="fld"><label>اكتب <b>DELETE</b> للتأكيد</label><input class="in ltr" id="rs_c"></div>`,
 `<button class="btn dan" onclick="if($('#rs_c').value==='DELETE'){localStorage.removeItem(KEY);DB=blankDB();S.user=null;sessionStorage.removeItem(SKEY);closeModal();render();}else toast('اكتب DELETE','err')">مسح نهائي</button><button class="btn sec" onclick="closeModal()">إلغاء</button>`);}
function clearDemo(){confirmBox('حذف جميع البنود والدفعات والحركات التجريبية؟',()=>{const ids=new Set(DB.items.filter(i=>i.demo).map(i=>i.id));DB.items=DB.items.filter(i=>!ids.has(i.id));DB.lots=DB.lots.filter(l=>!ids.has(l.itemId));DB.tx=DB.tx.filter(t=>!ids.has(t.itemId));audit('حذف البيانات التجريبية','');save();render();toast('تم الحذف','ok');},true,'حذف');}

/* ---------------- demo data ---------------- */
function seedDemo(){const D={CHEM:[['Glucose Reagent (GLU)','Cobas c501'],['Creatinine Reagent (CREA)','Cobas c501'],['ALT/GPT Reagent','Cobas c501'],['Calibrator for Automated Systems (CFAS)','Cobas c501']],
 HEMA:[['CBC Diluent (CellPack)','Sysmex XN'],['Lysercell WDF','Sysmex XN'],['XN Check Control 3-Level','Sysmex XN']],BB:[['Anti-A Monoclonal Antisera',''],['Anti-D (IgM/IgG) Antisera',''],['ABO/Rh Gel Cards','Ortho']],
 MICRO:[['Blood Agar Plates',''],['Gram Stain Kit',''],['BacT/ALERT Pediatric Bottles','BacT/ALERT']],HORM:[['TSH Reagent Pack','Architect i2000'],['Free T4 Reagent','Architect i2000'],['Total Beta-hCG Reagent','Architect i2000']],
 SPCH:[['HbA1c Reagent','Tosoh G8'],['25-OH Vitamin D Reagent','Liaison']],SERO:[['HBsAg Qualitative II','Architect i2000'],['HIV Ag/Ab Combo','Architect i2000'],['CRP Latex Kit','']],
 POCT:[['Glucometer Test Strips','Accu-Chek'],['Blood Gas Cartridge','GEM 5000']],SR:[['EDTA Vacutainer Tubes 3mL',''],['SST Gel Tubes 5mL','']],SO:[['Biohazard Specimen Bags',''],['Triple Packaging Kit UN3373','']]};
 let n=1;const now=Date.now();Object.entries(D).forEach(([dep,list])=>list.forEach(([name,an],k)=>{const it={id:uid('i'),demo:true,dept:dep,name,moh:'41'+pad(n++,8),gtin:'',cat:/Control|Calibrator/.test(name)?(/Control/.test(name)?'control':'calibrator'):/Tubes|Bags|Packaging|Plates|Strips/.test(name)?'consumable':'reagent',unit:/Tubes|Strips/.test(name)?'Box':/Plates/.test(name)?'Pack':'Kit',perUnit:/Tubes/.test(name)?100:/Strips/.test(name)?50:/Cards/.test(name)?24:/Plates/.test(name)?10:/Bags|Packaging/.test(name)?1:[100,200,500,50][k%4],subUnit:/Tubes/.test(name)?'Tube':/Strips/.test(name)?'Strip':/Cards/.test(name)?'Card':/Plates/.test(name)?'Plate':'Test',min:k%2?3:2,lead:14,storage:/Tubes|Bags|Packaging/.test(name)?'15-25°C':'2-8°C',analyzer:an,supplier:'',active:true,created:new Date().toISOString()};DB.items.push(it);
  const pattern=[[400,6],[25,2],[-5,1],[150,1],[70,4],[0,0]][(n+k)%6];if(!pattern[1])return;
  const mk=(days,q)=>{const l={id:DB.meta.nextLot++,pu:it.perUnit,itemId:it.id,lot:'L'+(240000+Math.floor(Math.random()*9999)),exp:todayStr(new Date(now+days*864e5)),qty:q,init:q+3,loc:it.storage==='2-8°C'?'ثلاجة '+(1+k%3):'رف '+'ABC'[k%3],recv:new Date(now-20*864e5).toISOString(),by:S.user.name};DB.lots.push(l);
   DB.tx.push({id:uid('t'),t:l.recv,type:'IN',itemId:it.id,lotId:l.id,lot:l.lot,dept:dep,qty:q+3,pu:it.perUnit,user:S.user.username,uname:S.user.name,note:'بيانات تجريبية'});
   for(let j=0;j<3;j++)DB.tx.push({id:uid('t'),t:new Date(now-(15-j*5)*864e5).toISOString(),type:'OUT',itemId:it.id,lotId:l.id,lot:l.lot,dept:dep,qty:1,pu:it.perUnit,user:S.user.username,uname:S.user.name,note:'بيانات تجريبية'});};
  mk(pattern[0],pattern[1]);if(pattern[0]>100&&k===0)mk(pattern[0]+60,3);}));}

/* ---------------- boot ---------------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function boot(){const sid=sessionStorage.getItem(SKEY);if(sid){const u=DB.users.find(x=>x.id===sid&&x.active);if(u)S.user=u;}render();
 window.addEventListener('storage',e=>{if(e.key===KEY){DB=loadDB();if(S.user){S.user=DB.users.find(x=>x.id===S.user.id)||null;}render();}});})();
</script>
</body>
</html>
